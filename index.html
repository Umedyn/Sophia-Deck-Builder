<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deckbuilder</title>
<style>
  :root {
    --bg: #22241f; --ink: #e9e7dd; --dim: #a9a89c;
    --panel: #34372e; --btn: #cfe0a8; --btn-ink: #21241f;
    --card: #2c2f27; --card-edge: #3a3d33;
    --energy: #d9b44a; --attack: #c65b4e; --life: #6fae62; --utility: #5b8fc6; --guard: #6fb0c6;
    --play: #7fb0e8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; gap: 28px;
    align-items: flex-start; justify-content: center; padding: 28px;
    background: var(--bg); color: var(--ink);
    font: 15px/1.4 system-ui, sans-serif;
  }
  #panel { width: 230px; flex: 0 0 auto; }
  #panel h1 { font-size: 18px; margin: 0 0 12px; letter-spacing: .05em; }
  #status { font-size: 15px; margin-bottom: 6px; }
  #detail { color: var(--dim); font-size: 13px; min-height: 20px; }
  #result {
    margin-top: 16px; padding: 10px 12px; border-radius: 8px;
    background: var(--panel); font-weight: 600; display: none;
  }
  #result.show { display: block; }
  #controls { margin-top: 18px; display: flex; flex-direction: column; gap: 8px; }
  #controls button, #actions button {
    padding: 10px 12px; border: 0; border-radius: 8px; cursor: pointer;
    font: 600 14px system-ui, sans-serif; letter-spacing: .03em;
    background: var(--btn); color: var(--btn-ink);
  }
  #controls button:hover:not(:disabled),
  #actions button:hover:not(:disabled) { background: #dcebba; }
  #controls button:disabled, #actions button:disabled {
    background: #3a3d33; color: #6d6f63; cursor: default;
  }

  #table { flex: 1 1 auto; max-width: 760px; display: flex; flex-direction: column; gap: 16px; }
  .seat { padding: 10px 14px; border-radius: 10px; background: rgba(0,0,0,.18); }
  .seatname { font-size: 15px; font-weight: 600; letter-spacing: .03em; }
  .seatname .you { color: var(--play); font-weight: 600; }
  .stats { color: var(--dim); font-size: 13px; margin-top: 3px; }

  .rowlabel { font-size: 12px; letter-spacing: .12em; color: var(--dim); margin-bottom: 8px; }
  .cards { display: flex; flex-wrap: wrap; gap: 10px; min-height: 10px; }
  .empty { color: #6d6f63; font-size: 13px; font-style: italic; padding: 6px 2px; }

  .card {
    position: relative; width: 108px; min-height: 128px;
    background: var(--card); border: 1px solid var(--card-edge);
    border-top: 3px solid var(--card-edge); border-radius: 8px;
    padding: 10px 10px 12px; display: flex; flex-direction: column; gap: 6px;
    cursor: default; user-select: none;
  }
  .card.energy  { border-top-color: var(--energy); }
  .card.attack  { border-top-color: var(--attack); }
  .card.life    { border-top-color: var(--life); }
  .card.utility { border-top-color: var(--utility); }
  .card.guard   { border-top-color: var(--guard); }
  .card .cname { font-weight: 600; font-size: 14px; }
  .card .ceff  { color: var(--dim); font-size: 12px; line-height: 1.35; }
  .card .cost  {
    position: absolute; top: -9px; right: -8px; width: 24px; height: 24px;
    border-radius: 50%; background: #3a3d33; color: var(--ink);
    font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center;
    border: 2px solid var(--bg);
  }
  .card.dim { opacity: .42; }
  .card.playable { cursor: pointer; outline: 2px solid transparent; }
  .card.playable:hover { border-color: var(--play); outline-color: var(--play); }

  .divider { height: 1px; border: 0; background: var(--card-edge); margin: 14px 0 4px; opacity: .7; }

  #actions { display: flex; gap: 10px; margin-top: 12px; }

  /* ---- OBS overlay: chrome-stripped, transparent ---- */
  body.overlay { background: transparent; padding: 0; }
  body.overlay #panel { display: none; }
  body.overlay #table { max-width: none; }
  body.overlay #actions { display: none; }
</style>
</head>
<body>
  <div id="panel">
    <h1>DECKBUILDER</h1>
    <div id="status">Connecting…</div>
    <div id="detail"></div>
    <div id="result"></div>
    <div id="controls">
      <button id="btnStart">Start Game</button>
      <button id="btnRestart">Restart Game</button>
    </div>
  </div>

  <div id="table">
    <div id="opp" class="seat"></div>
    <div id="market">
      <div class="rowlabel">MARKET</div>
      <div id="marketRow" class="cards"></div>
    </div>
    <div id="me" class="seat">
      <div id="meInfo"></div>
      <div id="inplayWrap" style="margin-top:10px; display:none">
        <div class="rowlabel">PLAYED THIS TURN</div>
        <div id="inplay" class="cards"></div>
        <hr class="divider">
      </div>
      <div id="hand" class="cards" style="margin-top:10px"></div>
      <div id="actions">
        <button id="btnPlayAll">Play All</button>
        <button id="btnEnd">End Turn</button>
      </div>
    </div>
  </div>

<script>
  const SEP = ":";                                  // must match SEP in deckbuilder.py
  const REASON = { life: "life depleted", turn_limit: "turn limit" };
  const overlay = new URLSearchParams(location.search).has("overlay");
  if (overlay) document.body.classList.add("overlay");

  let view = null;

  const labelFor = slot => `Player ${slot + 1}`;
  function interactive() {
    return !!(view && view.started && view.active_is_human && !view.terminal && !overlay);
  }

  function cardEl(card, token, playable, dimmed, showCost) {
    const cls = ["card", card.type];
    if (playable) cls.push("playable");
    if (dimmed)   cls.push("dim");
    const badge = (showCost && card.cost > 0) ? `<span class="cost">${card.cost}</span>` : "";
    const attr  = playable ? ` data-token="${token}"` : "";
    return `<div class="${cls.join(" ")}"${attr}>${badge}`
         + `<div class="cname">${card.name}</div>`
         + `<div class="ceff">${card.effect}</div></div>`;
  }

  function update() {
    if (!view) return;
    const players = view.players || [];
    const active  = (view.active_slot != null) ? view.active_slot : view.active;
    const opp     = active ^ 1;
    const legal   = new Set(view.legal_moves || []);
    const inter   = interactive();
    const guardStr = p => p.guard ? ` · Guard ${p.guard}` : "";

    // opponent — public counts only, hand hidden
    const o = players[opp] || {};
    document.getElementById("opp").innerHTML =
      `<div class="seatname">${labelFor(opp)}</div>`
    + `<div class="stats">Life ${o.life}${guardStr(o)} · Deck ${o.deck} · Discard ${o.discard} · Hand ${o.hand_count}</div>`;

    // market — affordability dims, legality clicks
    document.getElementById("marketRow").innerHTML =
      (view.market || []).map(c => {
        const tok = `BUY${SEP}${c.id}`;
        return cardEl(c, tok, inter && legal.has(tok), !c.affordable, true);   // market
      }).join("") || `<div class="empty">market empty</div>`;

    // active seat — full hand face-up (whoever's on turn: Sophia or human)
    const m = players[active] || {};
    document.getElementById("meInfo").innerHTML =
      `<div class="seatname">${labelFor(active)}${inter ? ' <span class="you">— your move</span>' : ""}</div>`
    + `<div class="stats">Life ${m.life}${guardStr(m)} · Energy ${m.energy} · Attack ${m.attack}`
    + ` · Deck ${m.deck} · Discard ${m.discard}</div>`;

    document.getElementById("hand").innerHTML =
      (view.hand || []).map(c => {
        const tok = `PLAY${SEP}${c.id}`;
        return cardEl(c, tok, inter && legal.has(tok), false, false);          // hand
      }).join("") || `<div class="empty">hand empty</div>`;

    document.getElementById("btnPlayAll").disabled = !(inter && legal.has("PLAY_ALL"));
    document.getElementById("btnEnd").disabled     = !(inter && legal.has("END"));

    // status panel
    const s = document.getElementById("status");
    const d = document.getElementById("detail");
    const res = document.getElementById("result");
    document.getElementById("btnStart").disabled   = view.started && !view.terminal;
    document.getElementById("btnRestart").disabled = !view.started;

    const inplay = view.in_play || [];
    document.getElementById("inplayWrap").style.display = inplay.length ? "" : "none";
    document.getElementById("inplay").innerHTML =
      inplay.map(c => cardEl(c, "", false, false)).join("");

    
    if (!view.started) {
      s.textContent = `${view.game} — press Start to begin`;
      d.textContent = ""; res.classList.remove("show");
      return;
    }
    s.textContent = view.terminal ? `${view.game} — game over`
                                  : `${view.game} — ${labelFor(active)} to move`;
    const bits = [];
    if (view.last_event) bits.push(view.last_event);
    if (inter) bits.push("your move — click a card");
    d.textContent = bits.join("  ·  ");

    if (view.terminal && view.result && view.result.over) {
      const r = view.result;
      res.textContent = r.winner ? `${r.winner} wins — ${REASON[r.reason] || r.reason}`
                                 : `Draw — ${REASON[r.reason] || r.reason}`;
      res.classList.add("show");
    } else {
      res.classList.remove("show");
    }
  }

  // ---- interaction: one delegated handler, filtered against legal_moves -----
  document.getElementById("table").addEventListener("click", e => {
    if (!interactive()) return;
    const card = e.target.closest(".card.playable");
    if (card && card.dataset.token) sendMove(card.dataset.token);
  });
  document.getElementById("btnPlayAll").onclick = () => { if (interactive()) sendMove("PLAY_ALL"); };
  document.getElementById("btnEnd").onclick     = () => { if (interactive()) sendMove("END"); };

  async function sendMove(token) {
    try {
      await fetch("/play", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ move: token, turn_id: view.turn_id, slot: view.active_slot }),
      });
    } catch (e) {}
    // next poll reflects the result; the same seat re-fires until END passes the turn
  }

  async function post(path) { try { await fetch(path, { method: "POST" }); } catch (e) {} }
  document.getElementById("btnStart").onclick   = () => post("/start");
  document.getElementById("btnRestart").onclick = () => post("/restart");

  async function poll() {
    try {
      const r = await fetch("/view");
      if (r.ok) { view = await r.json(); update(); }
    } catch (e) {}
    setTimeout(poll, 500);
  }
  poll();
</script>
</body>
</html>
